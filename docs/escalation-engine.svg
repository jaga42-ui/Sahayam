<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 460" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Sahayam SOS escalation state machine</title>
  <desc id="desc">An SOS starts broadcasting at 5km and widens to 15km then 50km if unanswered, expiring after the final level. A donor response moves it to matched, and a verified pickup PIN moves it to fulfilled.</desc>

  <rect x="0" y="0" width="940" height="460" fill="#faf6ec"/>

  <text x="40" y="48" font-size="22" font-weight="800" fill="#29524a" letter-spacing="0.5">Emergency SOS — Escalation State Machine</text>
  <text x="40" y="72" font-size="13" font-weight="600" fill="#846b8a">Timeout-driven radius expansion · first response freezes escalation</text>

  <!-- defs: arrowheads -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#29524a"/>
    </marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9f1164"/>
    </marker>
    <marker id="arrowM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#846b8a"/>
    </marker>
  </defs>

  <!-- ===== TOP ROW: escalation ladder ===== -->
  <!-- BROADCASTING -->
  <g>
    <rect x="40" y="120" width="180" height="78" rx="16" fill="#29524a"/>
    <text x="130" y="152" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">BROADCASTING</text>
    <text x="130" y="174" text-anchor="middle" font-size="12.5" font-weight="600" fill="#cfe0db">5 km ring</text>
  </g>

  <!-- ESCALATING 15km -->
  <g>
    <rect x="290" y="120" width="180" height="78" rx="16" fill="#34655b"/>
    <text x="380" y="152" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">ESCALATING</text>
    <text x="380" y="174" text-anchor="middle" font-size="12.5" font-weight="600" fill="#cfe0db">15 km ring</text>
  </g>

  <!-- ESCALATING 50km -->
  <g>
    <rect x="540" y="120" width="180" height="78" rx="16" fill="#34655b"/>
    <text x="630" y="152" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">ESCALATING</text>
    <text x="630" y="174" text-anchor="middle" font-size="12.5" font-weight="600" fill="#cfe0db">50 km ring</text>
  </g>

  <!-- EXPIRED -->
  <g>
    <rect x="790" y="120" width="120" height="78" rx="16" fill="#faf6ec" stroke="#846b8a" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="850" y="152" text-anchor="middle" font-size="15" font-weight="800" fill="#846b8a">EXPIRED</text>
    <text x="850" y="174" text-anchor="middle" font-size="11.5" font-weight="600" fill="#9c8aa0">unanswered</text>
  </g>

  <!-- ladder arrows + timeout labels -->
  <line x1="220" y1="159" x2="288" y2="159" stroke="#29524a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="254" y="148" text-anchor="middle" font-size="10.5" font-weight="700" fill="#29524a">2 min</text>

  <line x1="470" y1="159" x2="538" y2="159" stroke="#29524a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="504" y="148" text-anchor="middle" font-size="10.5" font-weight="700" fill="#29524a">3 min</text>

  <line x1="720" y1="159" x2="788" y2="159" stroke="#846b8a" stroke-width="2.5" marker-end="url(#arrowM)"/>
  <text x="754" y="148" text-anchor="middle" font-size="10.5" font-weight="700" fill="#846b8a">5 min</text>

  <!-- ===== BOTTOM ROW: resolution path ===== -->
  <g>
    <rect x="290" y="320" width="180" height="78" rx="16" fill="#9f1164"/>
    <text x="380" y="352" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">MATCHED</text>
    <text x="380" y="374" text-anchor="middle" font-size="12" font-weight="600" fill="#f3cfe2">donor en route</text>
  </g>

  <g>
    <rect x="540" y="320" width="180" height="78" rx="16" fill="#7a2c4f"/>
    <text x="630" y="352" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">FULFILLED</text>
    <text x="630" y="374" text-anchor="middle" font-size="12" font-weight="600" fill="#f3cfe2">help delivered</text>
  </g>

  <!-- response arrows from each active state down to MATCHED -->
  <path d="M130,198 C130,300 250,300 290,348" fill="none" stroke="#9f1164" stroke-width="2.5" marker-end="url(#arrowR)"/>
  <path d="M380,198 L380,318" fill="none" stroke="#9f1164" stroke-width="2.5" marker-end="url(#arrowR)"/>
  <path d="M630,198 C630,270 470,280 432,322" fill="none" stroke="#9f1164" stroke-width="2.5" marker-end="url(#arrowR)"/>
  <text x="398" y="258" font-size="11" font-weight="800" fill="#9f1164">donor responds</text>

  <!-- matched -> fulfilled -->
  <line x1="470" y1="359" x2="538" y2="359" stroke="#9f1164" stroke-width="2.5" marker-end="url(#arrowR)"/>
  <text x="504" y="348" text-anchor="middle" font-size="10" font-weight="700" fill="#9f1164">PIN</text>

  <!-- ===== legend ===== -->
  <g font-size="11.5" font-weight="700">
    <rect x="40" y="424" width="16" height="12" rx="3" fill="#29524a"/>
    <text x="62" y="434" fill="#5b5560">in-flight (escalating)</text>
    <rect x="230" y="424" width="16" height="12" rx="3" fill="#9f1164"/>
    <text x="252" y="434" fill="#5b5560">resolved (matched / fulfilled)</text>
    <rect x="470" y="424" width="16" height="12" rx="3" fill="#faf6ec" stroke="#846b8a" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="492" y="434" fill="#5b5560">terminal failure (expired)</text>
  </g>
</svg>
